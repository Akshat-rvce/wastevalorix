<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients matching the site's palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030A05"/>
      <stop offset="60%" stop-color="#0A1A0D"/>
      <stop offset="100%" stop-color="#030A05"/>
    </linearGradient>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00BCD4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00BCD4"/>
    </linearGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="zapGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-space {
      font-family: 'Space Grotesk', 'Outfit', 'Inter', 'Segoe UI', sans-serif;
    }
    .font-dm {
      font-family: 'DM Sans', 'Inter', sans-serif;
    }
    .brand-title {
      font-weight: 700;
      letter-spacing: -1.5px;
    }
    .brand-subtitle {
      font-weight: 500;
      letter-spacing: 3.5px;
      fill: #7A9A80;
    }
    .grid-lines {
      stroke: #0A2210;
      stroke-width: 0.8;
      opacity: 0.4;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Technical Grid Pattern -->
  <g class="grid-lines">
    <!-- Horizontal -->
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <!-- Vertical -->
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="500" y1="0" x2="500" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="700" y1="0" x2="700" y2="350"/>
    <line x1="800" y1="0" x2="800" y2="350"/>
    <line x1="900" y1="0" x2="900" y2="350"/>
    <line x1="1000" y1="0" x2="1000" y2="350"/>
    <line x1="1100" y1="0" x2="1100" y2="350"/>
  </g>

  <!-- Atmospheric Glow blobs -->
  <circle cx="150" cy="175" r="160" fill="#00E676" opacity="0.04" filter="url(#softGlow)" />
  <circle cx="950" cy="175" r="200" fill="#00BCD4" opacity="0.03" filter="url(#softGlow)" />

  <!-- Left Side: Main Logo Branding -->
  <g transform="translate(80, 0)">
    
    <!-- Zap Logo Icon with rounded outer box -->
    <g transform="translate(0, 110)">
      <!-- Outer rounded glass-like box -->
      <rect x="0" y="0" width="130" height="130" rx="24" fill="#0A1A0D" stroke="rgba(0,230,118,0.2)" stroke-width="2" filter="url(#zapGlow)" />
      
      <!-- Scale/Center Zap symbol -->
      <g transform="translate(25, 20) scale(4.5)">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="url(#zapGrad)" filter="url(#zapGlow)"/>
      </g>
    </g>

    <!-- Brand Name Text -->
    <text x="155" y="190" class="font-space brand-title" font-size="70" fill="#ffffff">
      Waste<tspan fill="url(#textGrad)">Valorix</tspan>
    </text>
    
    <!-- Subtitle description below the brand name -->
    <text x="160" y="235" class="font-dm brand-subtitle" font-size="14.5">
      THE AI WASTE-TO-ENERGY HYBRID ENGINE
    </text>
    
    <!-- RVCE Department tag -->
    <rect x="160" y="75" width="140" height="24" rx="12" fill="#0A1A0D" stroke="rgba(0,230,118,0.15)" stroke-width="1" />
    <text x="230" y="91" text-anchor="middle" class="font-dm" font-size="11" fill="#7A9A80" font-weight="600" letter-spacing="1">
      RVCE PROJECT
    </text>

  </g>

  <!-- Right Side: Interactive Home Page Screenshot Mockup -->
  <g>
    <!-- Clip path to round the screenshot corners -->
    <clipPath id="mockupClip">
      <rect x="650" y="45" width="470" height="260" rx="16" />
    </clipPath>
    
    <!-- Outer glow for the screenshot window -->
    <rect x="648" y="43" width="474" height="264" rx="18" fill="none" stroke="url(#zapGrad)" stroke-width="3" filter="url(#zapGlow)" opacity="0.6" />
    
    <!-- Embedded image -->
    <image href="HOME%20PAGE.png" x="650" y="45" width="470" height="260" preserveAspectRatio="xMidYMid slice" clip-path="url(#mockupClip)" />
    
    <!-- Subtle tech overlay border details -->
    <rect x="650" y="45" width="470" height="260" rx="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" clip-path="url(#mockupClip)" />
  </g>

  <!-- Bottom border decorative line -->
  <line x1="100" y1="310" x2="1100" y2="310" stroke="rgba(0,230,118,0.15)" stroke-width="1" />
  <circle cx="100" cy="310" r="3" fill="#00E676" />
  <circle cx="1100" cy="310" r="3" fill="#00BCD4" />

  <!-- Tech corner accents -->
  <path d="M 25,25 L 60,25 M 25,25 L 25,60" stroke="#00E676" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 1175,25 L 1140,25 M 1175,25 L 1175,60" stroke="#00E676" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 25,325 L 60,325 M 25,325 L 25,290" stroke="#00E676" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 1175,325 L 1140,325 M 1175,325 L 1175,290" stroke="#00E676" stroke-width="2" fill="none" opacity="0.6"/>

</svg>
